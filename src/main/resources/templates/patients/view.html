<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Patient Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container my-5">
    <h2 class="mb-4">Patient Profile</h2>
    <div class="card p-4" style="max-width:600px;">
        <p><strong>Name:</strong> <span th:text="${patient.fullName}"></span></p>
        <p><strong>Email:</strong> <span th:text="${patient.email}"></span></p>
        <p><strong>Phone:</strong> <span th:text="${patient.phoneNumber}"></span></p>
        <p><strong>Address:</strong> <span th:text="${patient.address}"></span></p>
        <p><strong>Date of Birth:</strong> <span th:text="${patient.dateOfBirth}"></span></p>
        <p><strong>Gender:</strong> <span th:text="${patient.gender}"></span></p>
        <p><strong>Blood Group:</strong> <span th:text="${patient.bloodGroup}"></span></p>
        <p><strong>Medical History:</strong> <span th:text="${patient.medicalHistory}"></span></p>
        <p><strong>Role (from getRole()):</strong> <span th:text="${patient.role}"></span></p>
        <a th:href="@{/patients}" class="btn btn-light mt-3">Back to list</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
