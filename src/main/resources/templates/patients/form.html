<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${formTitle}">Patient Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container my-5">
    <h2 class="mb-4" th:text="${formTitle}">Patient Form</h2>

    <div class="card p-4" style="max-width:700px;">
        <form th:action="${patient.id} == null ? @{/patients/save} : @{/patients/update/{id}(id=${patient.id})}"
              method="post">
            <input type="hidden" name="id" th:value="${patient.id}"/>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" name="fullName" th:value="${patient.fullName}" required/>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" th:value="${patient.email}" required/>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text" class="form-control" name="phoneNumber" th:value="${patient.phoneNumber}" required/>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text" class="form-control" name="address" th:value="${patient.address}"/>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" class="form-control" name="dateOfBirth" th:value="${patient.dateOfBirth}"/>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Gender</label>
                    <select class="form-select" name="gender">
                        <option th:selected="${patient.gender == 'Male'}">Male</option>
                        <option th:selected="${patient.gender == 'Female'}">Female</option>
                        <option th:selected="${patient.gender == 'Other'}">Other</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Blood Group</label>
                    <input type="text" class="form-control" name="bloodGroup" th:value="${patient.bloodGroup}" placeholder="e.g. O+"/>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Medical History</label>
                <textarea class="form-control" name="medicalHistory" rows="3" th:text="${patient.medicalHistory}"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/patients}" class="btn btn-light">Cancel</a>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
