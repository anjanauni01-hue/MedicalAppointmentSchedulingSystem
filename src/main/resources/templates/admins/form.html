<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${formTitle}">Admin Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container my-5">
    <h2 class="mb-4" th:text="${formTitle}">Admin Form</h2>

    <div class="card p-4" style="max-width:700px;">
        <form th:action="${admin.id} == null ? @{/admins/save} : @{/admins/update/{id}(id=${admin.id})}"
              method="post">
            <input type="hidden" name="id" th:value="${admin.id}"/>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" name="fullName" th:value="${admin.fullName}" required/>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" th:value="${admin.email}" required/>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text" class="form-control" name="phoneNumber" th:value="${admin.phoneNumber}" required/>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text" class="form-control" name="address" th:value="${admin.address}"/>
            </div>
            <div class="mb-3">
                <label class="form-label">Designation</label>
                <input type="text" class="form-control" name="designation" th:value="${admin.designation}"
                       placeholder="e.g. System Administrator"/>
            </div>

            <button type="submit" class="btn btn-secondary">Save</button>
            <a th:href="@{/admins}" class="btn btn-light">Cancel</a>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
