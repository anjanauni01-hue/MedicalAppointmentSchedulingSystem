<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Admins - MASS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Admins</h2>
        <a th:href="@{/admins/new}" class="btn btn-secondary">+ Register Admin</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card p-3">
        <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Designation</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="admin : ${admins}">
                <td th:text="${admin.id}"></td>
                <td th:text="${admin.fullName}"></td>
                <td th:text="${admin.email}"></td>
                <td th:text="${admin.phoneNumber}"></td>
                <td th:text="${admin.designation}"></td>
                <td class="text-end">
                    <a th:href="@{/admins/edit/{id}(id=${admin.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                    <a th:href="@{/admins/delete/{id}(id=${admin.id})}" class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('Delete this admin?');">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(admins)}">
                <td colspan="6" class="text-center text-muted py-4">No admins found.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <footer class="mt-5">SE1020 - Object Oriented Programming | Medical Appointment Scheduling System</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
