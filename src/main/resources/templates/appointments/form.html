<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Book Appointment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container my-5">
    <h2 class="mb-4">Book Appointment</h2>

    <div class="card p-4" style="max-width:700px;">
        <form th:action="@{/appointments/save}" method="post">

            <div class="mb-3">
                <label class="form-label">Patient</label>
                <select class="form-select" name="patientId" required>
                    <option value="">-- Select Patient --</option>
                    <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.fullName}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Doctor</label>
                <select class="form-select" name="doctorId" required>
                    <option value="">-- Select Doctor --</option>
                    <option th:each="d : ${doctors}" th:value="${d.id}"
                            th:text="${'Dr. ' + d.fullName + ' (' + d.specialization + ')'}"></option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Date</label>
                    <input type="date" class="form-control" name="appointmentDate" required/>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Time</label>
                    <input type="time" class="form-control" name="appointmentTime" required/>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Reason for Visit</label>
                <textarea class="form-control" name="reasonForVisit" rows="2"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Appointment Type</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="appointmentType" value="IN_PERSON"
                           id="typeInPerson" checked onclick="toggleType()"/>
                    <label class="form-check-label" for="typeInPerson">In-Person</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="appointmentType" value="ONLINE"
                           id="typeOnline" onclick="toggleType()"/>
                    <label class="form-check-label" for="typeOnline">Online</label>
                </div>
            </div>

            <div class="mb-3" id="roomField">
                <label class="form-label">Room Number</label>
                <input type="text" class="form-control" name="roomNumber" placeholder="e.g. Room 204"/>
            </div>

            <div class="mb-3 d-none" id="linkField">
                <label class="form-label">Meeting Link</label>
                <input type="text" class="form-control" name="meetingLink" placeholder="Generated / provided at confirmation"/>
            </div>

            <button type="submit" class="btn btn-warning">Book Appointment</button>
            <a th:href="@{/appointments}" class="btn btn-light">Cancel</a>
        </form>
    </div>
</div>

<script>
    function toggleType() {
        const isOnline = document.getElementById('typeOnline').checked;
        document.getElementById('roomField').classList.toggle('d-none', isOnline);
        document.getElementById('linkField').classList.toggle('d-none', !isOnline);
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
