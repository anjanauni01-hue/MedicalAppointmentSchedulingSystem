<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Appointment Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container my-5">
    <h2 class="mb-4">Appointment Details</h2>
    <div class="card p-4" style="max-width:650px;">
        <p><strong>Patient:</strong> <span th:text="${appointment.patient.fullName}"></span></p>
        <p><strong>Doctor:</strong> Dr. <span th:text="${appointment.doctor.fullName}"></span>
            (<span th:text="${appointment.doctor.specialization}"></span>)</p>
        <p><strong>Date:</strong> <span th:text="${appointment.appointmentDate}"></span></p>
        <p><strong>Time:</strong> <span th:text="${appointment.appointmentTime}"></span></p>
        <p><strong>Reason for Visit:</strong> <span th:text="${appointment.reasonForVisit}"></span></p>
        <p><strong>Appointment Type:</strong> <span th:text="${appointment.appointmentType}"></span></p>
        <p><strong>Mode Details (polymorphic getModeDetails()):</strong> <span th:text="${appointment.modeDetails}"></span></p>
        <p><strong>Status:</strong> <span th:text="${appointment.status}"></span></p>
        <p><strong>Base Consultation Fee:</strong> LKR <span th:text="${appointment.doctor.consultationFee}"></span></p>
        <p><strong>Calculated Fee (polymorphic calculateFee()):</strong>
            <strong class="text-success">LKR <span th:text="${calculatedFee}"></span></strong></p>
        <a th:href="@{/appointments}" class="btn btn-light mt-3">Back to list</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
