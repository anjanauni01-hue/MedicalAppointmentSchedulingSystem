<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Doctor Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container my-5">
    <h2 class="mb-4">Doctor Profile</h2>
    <div class="card p-4" style="max-width:600px;">
        <p><strong>Name:</strong> Dr. <span th:text="${doctor.fullName}"></span></p>
        <p><strong>Email:</strong> <span th:text="${doctor.email}"></span></p>
        <p><strong>Phone:</strong> <span th:text="${doctor.phoneNumber}"></span></p>
        <p><strong>Specialization:</strong> <span th:text="${doctor.specialization}"></span></p>
        <p><strong>License No:</strong> <span th:text="${doctor.licenseNumber}"></span></p>
        <p><strong>Consultation Fee:</strong> LKR <span th:text="${doctor.consultationFee}"></span></p>
        <p><strong>Available Days:</strong> <span th:text="${doctor.availableDays}"></span></p>
        <p><strong>Role (from getRole()):</strong> <span th:text="${doctor.role}"></span></p>
        <a th:href="@{/doctors}" class="btn btn-light mt-3">Back to list</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
