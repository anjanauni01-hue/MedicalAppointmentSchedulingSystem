<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${formTitle}">Doctor Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container my-5">
    <h2 class="mb-4" th:text="${formTitle}">Doctor Form</h2>

    <div class="card p-4" style="max-width:700px;">
        <form th:action="${doctor.id} == null ? @{/doctors/save} : @{/doctors/update/{id}(id=${doctor.id})}"
              method="post">
            <input type="hidden" name="id" th:value="${doctor.id}"/>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" name="fullName" th:value="${doctor.fullName}" required/>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" th:value="${doctor.email}" required/>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text" class="form-control" name="phoneNumber" th:value="${doctor.phoneNumber}" required/>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text" class="form-control" name="address" th:value="${doctor.address}"/>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Specialization</label>
                    <input type="text" class="form-control" name="specialization" th:value="${doctor.specialization}" required
                           placeholder="e.g. Cardiologist"/>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">License Number</label>
                    <input type="text" class="form-control" name="licenseNumber" th:value="${doctor.licenseNumber}"/>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Consultation Fee (LKR)</label>
                    <input type="number" step="0.01" class="form-control" name="consultationFee" th:value="${doctor.consultationFee}"/>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Available Days</label>
                    <input type="text" class="form-control" name="availableDays" th:value="${doctor.availableDays}"
                           placeholder="e.g. Monday,Wednesday,Friday"/>
                </div>
            </div>

            <button type="submit" class="btn btn-success">Save</button>
            <a th:href="@{/doctors}" class="btn btn-light">Cancel</a>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
