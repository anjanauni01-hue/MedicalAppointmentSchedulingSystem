<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Doctors - MASS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Doctors</h2>
        <a th:href="@{/doctors/new}" class="btn btn-success">+ Register Doctor</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form class="row g-2 mb-4" th:action="@{/doctors}" method="get">
        <div class="col-md-4">
            <input type="text" name="q" class="form-control" placeholder="Search by specialization..." th:value="${query}"/>
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-secondary" type="submit">Search</button>
        </div>
    </form>

    <div class="card p-3">
        <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Specialization</th>
                <th>License No.</th>
                <th>Fee (LKR)</th>
                <th>Available Days</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="doctor : ${doctors}">
                <td th:text="${doctor.id}"></td>
                <td th:text="${'Dr. ' + doctor.fullName}"></td>
                <td th:text="${doctor.specialization}"></td>
                <td th:text="${doctor.licenseNumber}"></td>
                <td th:text="${doctor.consultationFee}"></td>
                <td th:text="${doctor.availableDays}"></td>
                <td class="text-end">
                    <a th:href="@{/doctors/view/{id}(id=${doctor.id})}" class="btn btn-sm btn-outline-info">View</a>
                    <a th:href="@{/doctors/edit/{id}(id=${doctor.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                    <a th:href="@{/doctors/delete/{id}(id=${doctor.id})}" class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('Delete this doctor?');">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(doctors)}">
                <td colspan="7" class="text-center text-muted py-4">No doctors found.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <footer class="mt-5">SE1020 - Object Oriented Programming | Medical Appointment Scheduling System</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
