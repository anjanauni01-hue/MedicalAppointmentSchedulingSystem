# ==========================================================
# Medical Appointment Scheduling System - Application Config
# ==========================================================

# ---- Server ----
server.port=8080

# ---- MySQL Database ----
# 1. Create the database first in MySQL Workbench / CLI:
#      CREATE DATABASE mass_db;
# 2. Change username/password below to match your local MySQL installation.
spring.datasource.url=jdbc:mysql://localhost:3306/mass_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# Hibernate will auto-create/update the tables from the entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Load sample data (data.sql) after Hibernate creates the schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ---- App info ----
spring.application.name=Medical Appointment Scheduling System
